[tox]
envlist = py{311,312,313,314,315}-sqlalchemy{2.0,2.1}-wtforms{3.1,3.2,3.3}

[testenv]
deps =
    .[test_all]
    pytest-cov
    sqlalchemy2.0: SQLAlchemy~=2.0.0
    sqlalchemy2.1: SQLAlchemy~=2.1.0
    wtforms3.1: WTForms~=3.1.0
    wtforms3.2: WTForms~=3.2.0
    wtforms3.3: WTForms~=3.3.0
commands = pip install -e ".[test]"
           py.test
install_command = pip install {packages}
recreate = True
