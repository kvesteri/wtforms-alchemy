[tool.pytest.ini_options]
filterwarnings = [
    'error:.*:sqlalchemy.exc.SADeprecationWarning',
    'error:.*:sqlalchemy.exc.SAWarning',
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "C90", # mccabe
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.isort]
order-by-type = false
