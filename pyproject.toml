[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "WTForms-Alchemy"
dynamic = ["version"]
description = "Generates WTForms forms from SQLAlchemy models."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Konsta Vesterinen", email = "konsta@fastmonkeys.com" }]
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "WTForms>=3.1.0",
    "WTForms-Components>=0.12.0",
    "SQLAlchemy-Utils>=0.43.0",
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
babel = ["Babel>=1.3"]
arrow = ["arrow>=0.3.4"]
phone = ["phonenumbers>=5.9.2"]
password = ["passlib >= 1.6, < 2.0"]
color = ["colour>=0.0.4"]
test = [
    "pytest>=2.3",
    "ruff==0.17.4",
    "WTForms-Alchemy[babel,arrow,phone,password,color]",
]

[project.urls]
Homepage = "https://github.com/kvesteri/wtforms-alchemy"

[tool.setuptools]
packages = ["wtforms_alchemy"]

[tool.setuptools.dynamic]
version = { attr = "wtforms_alchemy.__version__" }

[tool.pytest.ini_options]
filterwarnings = [
    'error:.*:sqlalchemy.exc.SADeprecationWarning',
    'error:.*:sqlalchemy.exc.SAWarning',
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "C90", # mccabe
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.isort]
order-by-type = false
